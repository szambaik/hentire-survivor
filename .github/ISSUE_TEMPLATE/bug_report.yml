name: Bug or incorrect game data / Hiba
description: Report an interface problem or an incorrect unlock/recipe.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: Reports are public. Do not include personal information or a full save. Magyarul is írhatsz.
  - type: textarea
    id: problem
    attributes:
      label: What happened? / Mi a hiba?
      description: Include the item, recipe or guide name and expected behaviour.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser / Eszköz és böngésző
  - type: input
    id: version
    attributes:
      label: Game version and DLC / Játékverzió és DLC
  - type: textarea
    id: steps
    attributes:
      label: Steps or source link / Lépések vagy forráslink
